openapi: 3.2.0
info:
  description: External API endpoints for Artie
  title: Artie Encryption Keys API
  version: v1.0.139
servers:
- url: https://api.artie.com
security:
- ApiKey: []
tags:
- name: Encryption Keys
paths:
  /encryption-keys:
    get:
      description: Lists all encryption keys for the authenticated company.
      operationId: encryption_key_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyEncryptionKey'
          description: OK
        '500':
          description: Internal Server Error
      summary: List encryption keys
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: encryption_key_list
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - encryption_keys:read
        retrySemantics: safe
        title: List encryption keys
        triggerDescription: Lists encryption key names and UUIDs (no secret material).
    post:
      description: Creates a new encryption key for the authenticated company.
      operationId: encryption_key_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterCreateEncryptionKeyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterCreateEncryptionKeyResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Create an encryption key
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Returns a newly generated encryption key.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: encryption_key_create
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Create encryption keys through the authenticated Dashboard setup flow.
        requiredScopes:
        - encryption_keys:write
        retrySemantics: unsafe
        title: Create an encryption key
        triggerDescription: Use when you need to create an encryption key.
  /encryption-keys/{uuid}:
    delete:
      description: Deletes an encryption key by UUID.
      operationId: encryption_key_delete
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Delete an encryption key
      tags:
      - Encryption Keys
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: encryption_key_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - encryption_keys:delete
        retrySemantics: safe-after-state-check
        title: Delete an encryption key
        triggerDescription: Deletes an encryption key by UUID. Does not decrypt already-landed columns.
    get:
      description: Retrieves an encryption key by UUID, including the decrypted key. Requires company admin.
      operationId: encryption_key_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsEncryptionKeyDetail'
          description: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get an encryption key
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Returns the decrypted encryption key.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: encryption_key_detail
        outputSensitivity: restricted-credentials
        readOnlyHint: true
        remediation: Use encryption_key_list for non-secret key references.
        requiredScopes:
        - encryption_keys:read
        retrySemantics: safe
        title: Get an encryption key
        triggerDescription: Use when you need to get an encryption key.
    post:
      description: Updates the name and description of an encryption key.
      operationId: encryption_key_update
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterUpdateEncryptionKeyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsEncryptionKey'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Update an encryption key
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: encryption_key_update
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - encryption_keys:write
        retrySemantics: unsafe
        title: Update an encryption key
        triggerDescription: Updates the name and description of an existing encryption key. Does not rotate the key material.
components:
  schemas:
    RouterCreateEncryptionKeyRequest:
      properties:
        description:
          type: string
        kmsKeyUUID:
          format: uuid
          type:
          - 'null'
          - string
        name:
          type: string
      required:
      - name
      type: object
    ListResponseBodyEncryptionKey:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PayloadsEncryptionKey'
          type: array
      required:
      - items
      type: object
    RouterUpdateEncryptionKeyRequest:
      properties:
        description:
          type: string
        name:
          type: string
      required:
      - name
      type: object
    PayloadsEncryptionKeyDetail:
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        key:
          type: string
        kmsKeyUUID:
          format: uuid
          type:
          - 'null'
          - string
        name:
          type: string
        type:
          type: string
        updatedAt:
          format: date-time
          type: string
        uuid:
          format: uuid
          type: string
      required:
      - uuid
      - name
      - type
      - key
      type: object
    RouterCreateEncryptionKeyResponse:
      properties:
        encryptionKey:
          $ref: '#/components/schemas/PayloadsEncryptionKey'
        key:
          type: string
      required:
      - encryptionKey
      - key
      type: object
    PayloadsEncryptionKey:
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        kmsKeyUUID:
          format: uuid
          type:
          - 'null'
          - string
        name:
          type: string
        type:
          type: string
        updatedAt:
          format: date-time
          type: string
        uuid:
          format: uuid
          type: string
      required:
      - uuid
      - name
      - type
      type: object
  securitySchemes:
    ApiKey:
      description: API key passed as a Bearer token in the Authorization header.
      scheme: bearer
      type: http
