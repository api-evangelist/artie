openapi: 3.2.0
info:
  description: External API endpoints for Artie
  title: Artie Column Hashing Salts API
  version: v1.0.139
servers:
- url: https://api.artie.com
security:
- ApiKey: []
tags:
- name: Column Hashing Salts
paths:
  /column-hashing-salts:
    get:
      description: Lists all column hashing salts for the authenticated company.
      operationId: column_hashing_salt_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyColumnHashingSalt'
          description: OK
        '500':
          description: Internal Server Error
      summary: List column hashing salts
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_list
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: List column hashing salts
        triggerDescription: Lists column hashing salt names and UUIDs (no secret).
    post:
      description: Creates a new column hashing salt for the authenticated company.
      operationId: column_hashing_salt_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterCreateColumnHashingSaltRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterCreateColumnHashingSaltResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Create a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts and returns a column-hashing salt.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: column_hashing_salt_create
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Create column-hashing salts through the authenticated Dashboard setup flow.
        requiredScopes:
        - column_hashing_salts:write
        retrySemantics: unsafe
        title: Create a column hashing salt
        triggerDescription: Use when you need to create a column hashing salt.
  /column-hashing-salts/{uuid}:
    delete:
      description: Deletes a column hashing salt by UUID.
      operationId: column_hashing_salt_delete
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Delete a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - column_hashing_salts:delete
        retrySemantics: safe-after-state-check
        title: Delete a column hashing salt
        triggerDescription: Deletes a column hashing salt by UUID. Does not unhash already-landed columns.
    get:
      description: Retrieves a column hashing salt by UUID, including the decrypted salt. Requires company admin.
      operationId: column_hashing_salt_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsColumnHashingSaltDetail'
          description: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Returns the decrypted column-hashing salt.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_detail
        outputSensitivity: restricted-credentials
        readOnlyHint: true
        remediation: Use column_hashing_salt_list for non-secret salt references.
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: Get a column hashing salt
        triggerDescription: Use when you need to get a column hashing salt.
    post:
      description: Updates the name and description of a column hashing salt.
      operationId: column_hashing_salt_update
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterUpdateColumnHashingSaltRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsColumnHashingSalt'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Update a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_update
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - column_hashing_salts:write
        retrySemantics: unsafe
        title: Update a column hashing salt
        triggerDescription: Updates the name and description of an existing column hashing salt. Does not rotate the secret.
  /column-hashing-salts/{uuid}/preview:
    post:
      description: Hashes a sample string value with this salt using the same function used by Artie's pipelines (HMAC-SHA256 keyed on the salt, or SHA-256 if the salt is empty). Returns the hex-encoded hash.
      operationId: column_hashing_salt_preview
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPreviewColumnHashingSaltRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPreviewColumnHashingSaltResponse'
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Preview a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: column_hashing_salt_preview
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - column_hashing_salts:read
        retrySemantics: safe
        title: Preview a column hashing salt
        triggerDescription: Hashes a sample string with this salt and returns the hex digest.
components:
  schemas:
    PayloadsColumnHashingSalt:
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        name:
          type: string
        updatedAt:
          format: date-time
          type: string
        uuid:
          format: uuid
          type: string
      required:
      - uuid
      - name
      type: object
    ListResponseBodyColumnHashingSalt:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PayloadsColumnHashingSalt'
          type: array
      required:
      - items
      type: object
    PayloadsColumnHashingSaltDetail:
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        name:
          type: string
        salt:
          type: string
        updatedAt:
          format: date-time
          type: string
        uuid:
          format: uuid
          type: string
      required:
      - uuid
      - name
      - salt
      type: object
    RouterUpdateColumnHashingSaltRequest:
      properties:
        description:
          type: string
        name:
          type: string
      required:
      - name
      type: object
    RouterCreateColumnHashingSaltResponse:
      properties:
        columnHashingSalt:
          $ref: '#/components/schemas/PayloadsColumnHashingSalt'
        salt:
          type: string
      required:
      - columnHashingSalt
      - salt
      type: object
    RouterPreviewColumnHashingSaltRequest:
      properties:
        value:
          type: string
      required:
      - value
      type: object
    RouterCreateColumnHashingSaltRequest:
      properties:
        description:
          type: string
        name:
          type: string
        salt:
          type: string
      required:
      - name
      type: object
    RouterPreviewColumnHashingSaltResponse:
      properties:
        hash:
          type: string
      required:
      - hash
      type: object
  securitySchemes:
    ApiKey:
      description: API key passed as a Bearer token in the Authorization header.
      scheme: bearer
      type: http
