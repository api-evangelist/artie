      description: Permanently deletes a source reader by UUID. The source reader
        must not be associated with any active pipelines before deletion.
      operationId: source_reader_delete
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a source reader
      tags:
      - Source Readers
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: source_reader_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - source_readers:delete
        retrySemantics: safe-after-state-check
        title: Delete a source reader
        triggerDescription: Deletes a source reader unused by any active pipeline.
          Does not delete the source connector.
    get:
      description: Retrieves a source reader by UUID, including database, settings,
        and table configuration. Sensitive fields may be present. MCP clients should
        echo this payload into source_reader_update.
      operationId: source_reader_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSourceReader'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get a source reader
      tags:
      - Source Readers
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: source_reader_detail
        outputSensitivity: restricted-credentials
        readOnlyHint: true
        requiredScopes:
        - source_readers:read
        retrySemantics: safe
        title: Get a source reader
        triggerDescription: Returns a source reader by uuid from pipeline_detail.sourceReaderUUID,
          not a pipeline uuid or connector uuid. Includes database, tablesConfig,
          and settings (replicationSlotOverride, publicationNameOverride, heartbeats).
          Sensitive fields may be present. Echo this into source_reader_update; do
          not invent a partial body. If pipeline_start 400s that two readers share
          slot artie, GET this, set settings.replicationSlotOverride to a unique lowercase
          name (digits and underscores, <=63), POST source_reader_update, then retry
          start.
    post:
      description: Updates an existing source reader by UUID. Echo the last source_reader_detail
        payload and change only the intended fields; omitting name, database, or connectorUUID
        overwrites them with empty values.
      operationId: source_reader_update
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsSourceReader'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSourceReader'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a source reader
      tags:
      - Source Readers
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: source_reader_update
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        requiredScopes:
        - source_readers:write
        retrySemantics: unsafe
        title: Update a source reader
        triggerDescription: Applies a SourceReader from source_reader_detail. Echo
          the last GET and change only the intended fields. Omitting name, database,
          or connectorUUID blanks them. To fix a duplicate Postgres slot (pipeline_start
          400 that two readers share artie), set settings.replicationSlotOverride
          to a unique lowercase name, then pipeline_start. This is not pipeline_update
          or connector_update.
  /source-readers/{uuid}/deploy:
    post:
      description: Deploys a shared source reader to the data plane. The source reader
        must be shared and pass validation before it can be deployed.
      operationId: source_reader_deploy
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Deploy a source reader
      tags:
      - Source Readers
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: source_reader_deploy
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - source_readers:write
        retrySemantics: safe-after-state-check
        title: Deploy a source reader
        triggerDescription: Deploys a shared, validated source reader. To take a draft
          pipeline live, use pipeline_start.
  /source-readers/{uuid}/status:
    post:
      description: Changes the status of a shared source reader (e.g. running, paused).
        Only shared source readers are supported; for non-shared source readers, use
        the pipeline status endpoint instead.
      operationId: source_reader_update_status
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterSourceReaderUpdateStatusRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSourceReader'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update source reader status
      tags:
      - Source Readers
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Returns source-reader configuration that can contain credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: source_reader_update_status
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Change source-reader status through the authenticated Dashboard
          setup flow.
        requiredScopes:
        - source_readers:write
        retrySemantics: safe-after-state-check
        title: Update source reader status
        triggerDescription: Use when you need to update source reader status.
  /source-readers/validate-unsaved:
    post:
      description: Validates a source reader configuration without persisting it.
      operationId: source_reader_validate_unsaved
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterSourceReaderValidateUnsavedRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterSourceReaderValidateUnsavedResponse'
          description: OK
        "204":
          description: No Content
        "500":
          description: Internal Server Error
      summary: Validate an unsaved source reader
      tags:
      - Source Readers
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exclusionReason: Accepts unsaved source-reader configuration that can contain
          credentials.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: source_reader_validate_unsaved
        outputSensitivity: none
        readOnlyHint: true
        remediation: Validate source-reader credentials through the authenticated
          Dashboard setup flow.
        requiredScopes:
        - source_readers:read
        retrySemantics: safe
        title: Validate an unsaved source reader
        triggerDescription: Use when you need to validate an unsaved source reader.
  /ssh-tunnels:
    post:
      description: Creates a new SSH tunnel for the authenticated company.
      operationId: ssh_tunnel_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterSSHTunnelCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSSHTunnel'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create an SSH tunnel
      tags:
      - SSH Tunnels
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: ssh_tunnel_create
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - ssh_tunnels:write
        retrySemantics: unsafe
        title: Create an SSH tunnel
        triggerDescription: Creates an SSH tunnel record. Keep the returned UUID;
          there is no list tool.
  /ssh-tunnels/{uuid}:
    delete:
      description: Permanently deletes an SSH tunnel by UUID. The tunnel must not
        be in use by any connectors or pipelines before it can be deleted.
      operationId: ssh_tunnel_delete
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete an SSH tunnel
      tags:
      - SSH Tunnels
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: ssh_tunnel_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - ssh_tunnels:delete
        retrySemantics: safe-after-state-check
        title: Delete an SSH tunnel
        triggerDescription: Deletes an SSH tunnel unused by any connector or pipeline.
    get:
      description: Retrieves the details of an SSH tunnel by UUID, including its host,
        port, username, public key, and whether it is currently in use.
      operationId: ssh_tunnel_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSSHTunnel'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get an SSH tunnel
      tags:
      - SSH Tunnels
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: ssh_tunnel_detail
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - ssh_tunnels:read
        retrySemantics: safe
        title: Get an SSH tunnel
        triggerDescription: Returns one SSH tunnel by UUID (no private key).
    post:
      description: Updates an existing SSH tunnel by UUID. You can modify the name,
        host, port, and username. Changes will mark associated pipelines as having
        undeployed changes.
      operationId: ssh_tunnel_update
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterSSHTunnelUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsSSHTunnel'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update an SSH tunnel
      tags:
      - SSH Tunnels
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: ssh_tunnel_update
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - ssh_tunnels:write
        retrySemantics: unsafe
        title: Update an SSH tunnel
        triggerDescription: Updates name, host, port, or username on an existing SSH
          tunnel. Does not rotate keys.
