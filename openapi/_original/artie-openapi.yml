    RouterPipelineBackfillRequest:
      properties:
        backfillBatchSize:
          description: Optional rows per batch. Saved as the pipeline's backfill batch
            size before the backfill starts, so later backfills use it too.
          minimum: 0
          type:
          - "null"
          - integer
        backfillDefaults:
          $ref: '#/components/schemas/PayloadsBackfillDefaultsPayload'
          description: Optional backfill speed. Saved as the pipeline's backfill speed
            before the backfill starts, so later backfills use it too.
        backfillFromDatabases:
          description: Optional source databases to backfill for regular-table backfills.
            Requires beforeBackfill to be the empty-string do-nothing option.
          items:
            type: string
          type:
          - array
          - "null"
        backfillFromSchemas:
          description: Optional source schemas to backfill for regular-table backfills.
            Requires beforeBackfill to be the empty-string do-nothing option.
          items:
            type: string
          type:
          - array
          - "null"
        beforeBackfill:
          description: 'Destination handling before the backfill: empty string leaves
            existing data unchanged, truncate_table truncates the destination table,
            and drop_table drops it.'
          enum:
          - ""
          - truncate_table
          - drop_table
          - swap_table
          type: string
        historyMode:
          description: When true, backfill the selected history tables instead of
            the regular tables.
          type: boolean
        keepOldTable:
          description: 'Only for swap_table: keep the destination table''s old rows
            in a separate table after the swap, until the next swap_table backfill
            of this table.'
          type: boolean
        tableUUIDs:
          description: UUIDs of the regular or history tables to backfill.
          items:
            format: uuid
            type: string
          type: array
      required:
      - tableUUIDs
      - beforeBackfill
      type: object
