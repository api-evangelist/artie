openapi: 3.2.0
info:
  description: External API endpoints for Artie
  title: Artie Connectors API
  version: v1.0.139
servers:
- url: https://api.artie.com
security:
- ApiKey: []
tags:
- name: Connectors
paths:
  /connectors:
    get:
      description: Returns all destination connectors for the authenticated company. Pass includeSourceConnectors=true to also include source connectors.
      operationId: connector_list
      parameters:
      - in: query
        name: includeSourceConnectors
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyLightConnector'
          description: OK
        '500':
          description: Internal Server Error
      summary: List connectors
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_list
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: List connectors
        triggerDescription: Lists saved connectors. Defaults to destinations; pass includeSourceConnectors=true for sources. Call this before connector_fetch_databases, connector_fetch_schemas, connector_fetch_tables, or connector_fetch_table_detail — those tools need a uuid from this list, not a pipeline uuid or sourceReaderUUID from pipeline_list.
    post:
      description: Creates a new source or destination connector for your Artie deployment. Configure database connections, authentication, and replication settings programmatically.
      operationId: connector_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Create a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: connector_create
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Create a connector
        triggerDescription: Creates a saved source or destination connector. Pass type, label, and sharedConfig (host, user, password, and type-specific fields). Keep the returned UUID for pipeline_create_from_source.
  /connectors/{uuid}:
    delete:
      description: Permanently removes a connector and its associated configuration. This stops any active replication pipelines that depend on the connector.
      operationId: connector_delete
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Delete a connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - connectors:delete
        retrySemantics: safe-after-state-check
        title: Delete a connector
        triggerDescription: Permanently deletes a saved connector by UUID and stops pipelines that depend on it.
    get:
      description: Retrieves the full configuration of a saved connector by uuid from connector_list, including type, label, and sharedConfig. Sensitive fields may be masked.
      operationId: connector_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_detail
        outputSensitivity: restricted-credentials
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Get a saved connector
        triggerDescription: Returns a saved connector by uuid from connector_list, not a pipeline uuid or sourceReaderUUID. Includes type, label, and sharedConfig. Sensitive fields may be masked placeholders. To ping that connector, pass this payload into unsaved_connector_ping and keep uuid set so stored secrets unmask.
    post:
      description: Updates the configuration of an existing source or destination connector. Modify connection settings, credentials, or replication parameters for a running pipeline.
      operationId: connector_update
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Update a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts and returns connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: connector_update
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Update connector credentials through the authenticated Dashboard setup flow.
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Update a connector
        triggerDescription: Use when you need to update a connector.
  /connectors/{uuid}/databases:
    get:
      description: Lists available databases on the target using a saved connector's configuration. Response metadata may include Iceberg S3 table bucket maintenance defaults.
      operationId: connector_fetch_databases
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorFetchDatabasesResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Fetch databases for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_databases
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch databases for a saved connector
        triggerDescription: Lists database names a saved source can see. uuid must come from connector_list with includeSourceConnectors=true. Do not pass a pipeline uuid or sourceReaderUUID.
  /connectors/{uuid}/detail:
    get:
      description: Returns detailed metadata for a specific table on the saved connector. tableName is required; databaseName defaults to the connector's configured database, schemaName defaults to the connector type's default schema, and isView is optional.
      operationId: connector_fetch_table_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      - in: query
        name: schemaName
        schema:
          type: string
      - in: query
        name: tableName
        required: true
        schema:
          type: string
      - in: query
        name: isView
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorTableDetailResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Fetch table detail for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_table_detail
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch table detail for a saved connector
        triggerDescription: Returns columns and metadata for one table on a saved connector. uuid must come from connector_list (includeSourceConnectors=true for sources). Do not pass a pipeline uuid or sourceReaderUUID. tableName is required. This is column metadata, not pipeline lag or row counts.
  /connectors/{uuid}/generate-shadow-script:
    post:
      description: Generates the SQL script to create shadow tables required for Oracle change data capture (CDC). Run this script on your Oracle source before starting replication.
      operationId: connector_generate_shadow_script
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorGenerateShadowScriptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorGenerateShadowScriptResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Generate Oracle shadow table script
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: connector_generate_shadow_script
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Generate Oracle shadow table script
        triggerDescription: Returns SQL to create Oracle shadow tables for CDC. Oracle sources only.
  /connectors/{uuid}/postgres-drop-replication-slot:
    post:
      description: Drops a PostgreSQL replication slot that is inactive or orphaned. Use this to clean up stale replication slots that may be preventing WAL cleanup on the source.
      operationId: connector_drop_postgres_replication_slot
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorDropReplicationSlotRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Drop a PostgreSQL replication slot
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_drop_postgres_replication_slot
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Drop a PostgreSQL replication slot
        triggerDescription: 'Drops an inactive PostgreSQL replication slot. Check connector_fetch_postgres_replication_slots first: only an inactive or lost slot can be dropped.'
  /connectors/{uuid}/postgres-replication-slots:
    get:
      description: Lists replication slots on the PostgreSQL source for the specified connector.
      operationId: connector_fetch_postgres_replication_slots
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyPostgresReplicationSlot'
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: List PostgreSQL replication slots
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_postgres_replication_slots
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: List PostgreSQL replication slots
        triggerDescription: Lists replication slots on a saved Postgres source (name, database, active, walStatus, retainedWALBytes, isReplica). uuid must come from connector_list with includeSourceConnectors=true, not a pipeline uuid or sourceReaderUUID; pass databaseName for the pipeline's reader database. Use for slot health and WAL retention, and to confirm a slot is inactive before connector_drop_postgres_replication_slot.
  /connectors/{uuid}/postgres-settings:
    get:
      description: Returns PostgreSQL server configuration settings relevant to replication for the specified connector.
      operationId: connector_fetch_postgres_settings
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PayloadsPostgresSetting'
                type: array
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Fetch PostgreSQL settings
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_postgres_settings
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch PostgreSQL settings
        triggerDescription: Returns replication-relevant server settings (name, value, unit, category) for a saved Postgres source, such as wal_level, max_replication_slots, max_wal_senders, and max_slot_wal_keep_size. uuid must come from connector_list with includeSourceConnectors=true. Use to check CDC prerequisites (wal_level must be logical) before pipeline_start or after it fails. Settings are changed on the database, not through Artie.
  /connectors/{uuid}/schemas:
    get:
      description: Lists available schemas on the target using a saved connector's configuration. Pass 'databaseName' as a query parameter.
      operationId: connector_fetch_schemas
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodySchemaResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Fetch schemas for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_schemas
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch schemas for a saved connector
        triggerDescription: Lists schemas on a saved connector. uuid must come from connector_list. Do not pass a pipeline uuid or sourceReaderUUID. Pass schemaName into connector_fetch_tables when the destination requires it.
  /connectors/{uuid}/start-dynamodb-export:
    post:
      description: Initiates a point-in-time export from Amazon DynamoDB for the specified connector. Use this to backfill your destination with existing DynamoDB table data.
      operationId: connector_start_dynamo_db_export
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorStartDynamoDBExportRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorStartDynamoDBExportResponse'
          description: OK
        '500':
          description: Internal Server Error
      summary: Start a DynamoDB export
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_start_dynamo_db_export
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Start a DynamoDB export
        triggerDescription: Starts a DynamoDB point-in-time export. DynamoDB sources only; for SQL CDC use pipeline_start.
  /connectors/{uuid}/tables:
    get:
      description: Lists available tables on the target using a saved connector's configuration. databaseName defaults to the connector's configured database; schemaName defaults to the connector type's default schema (e.g. 'public' for Postgres, 'dbo' for SQL Server).
      operationId: connector_fetch_tables
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: databaseName
        schema:
          type: string
      - in: query
        name: schemaName
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyConnectorTableDetailResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Fetch tables for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: connector_fetch_tables
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch tables for a saved connector
        triggerDescription: Lists tables on a saved connector. uuid must come from connector_list. Do not pass a pipeline uuid or sourceReaderUUID. Use to choose names for pipeline_update.tables.
  /connectors/databases:
    post:
      description: Lists available databases on the target using an unsaved connector configuration. Useful during connector setup to discover existing databases. Response metadata may include Iceberg S3 table bucket maintenance defaults.
      operationId: unsaved_connector_fetch_databases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorFetchDatabasesResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Fetch databases for an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts an unsaved connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_fetch_databases
        outputSensitivity: none
        readOnlyHint: true
        remediation: Save the connector before discovering databases.
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Fetch databases for an unsaved connector
        triggerDescription: Use when you need to fetch databases for an unsaved connector.
  /connectors/new-database:
    post:
      description: Creates a new database on the target destination using a connector configuration that has not yet been saved. Useful during initial setup to prepare the destination.
      operationId: unsaved_connector_create_database
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorCreateDatabaseRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Create a database on an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exclusionReason: Accepts an unsaved connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_create_database
        outputSensitivity: none
        readOnlyHint: false
        remediation: Create the database through the authenticated Dashboard setup flow.
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Create a database on an unsaved connector
        triggerDescription: Use when you need to create a database on an unsaved connector.
  /connectors/new-schema:
    post:
      description: Creates a new schema on the target destination using a connector configuration that has not yet been saved. Useful during initial setup to organize destination tables.
      operationId: unsaved_connector_create_schema
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorCreateSchemaRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Create a schema on an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exclusionReason: Accepts an unsaved connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_create_schema
        outputSensitivity: none
        readOnlyHint: false
        remediation: Create the schema through the authenticated Dashboard setup flow.
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Create a schema on an unsaved connector
        triggerDescription: Use when you need to create a schema on an unsaved connector.
  /connectors/new-snowflake-warehouse:
    post:
      description: Creates a new Snowflake virtual warehouse using an unsaved connector configuration. Useful during initial setup to provision compute resources for data replication.
      operationId: unsaved_connector_create_snowflake_warehouse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorCreateSnowflakeWarehouseRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Create a Snowflake warehouse on an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exclusionReason: Accepts an unsaved connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_create_snowflake_warehouse
        outputSensitivity: none
        readOnlyHint: false
        remediation: Create the warehouse through the authenticated Dashboard setup flow.
        requiredScopes:
        - connectors:write
        retrySemantics: unsafe
        title: Create a Snowflake warehouse on an unsaved connector
        triggerDescription: Use when you need to create a Snowflake warehouse on an unsaved connector.
  /connectors/ping:
    post:
      description: Tests network connectivity and authentication for a connector configuration before saving it. Pass type, sharedConfig, and connectionRole. Success is 204; a failed connection attempt returns 200 with an error message.
      operationId: unsaved_connector_ping
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorPingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorPingResponse'
          description: OK
        '204':
          description: No Content
        '400':
          description: Bad Request
      summary: Ping a connector
      tags:
      - Connectors
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_ping
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: Ping a connector
        triggerDescription: 'Pings a connector before connector_create. Pass type, sharedConfig (host, user, password, and type-specific fields), and connectionRole (source or destination). This is not a uuid ping — do not pass a pipeline uuid or sourceReaderUUID. Postgres needs a database name, Oracle a service name, S3 a bucket. Success is {"success": true}; a JSON error field means the host or credentials failed.'
  /connectors/postgres-publications:
    post:
      description: Lists logical replication publications on a PostgreSQL source using an unsaved connector configuration. Useful during connector setup to let users select an existing publication.
      operationId: unsaved_connector_fetch_postgres_publications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorFetchPostgresPublicationsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyPostgresPublication'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: List PostgreSQL publications for an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts an unsaved connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: unsaved_connector_fetch_postgres_publications
        outputSensitivity: none
        readOnlyHint: true
        remediation: Save the connector before discovering PostgreSQL publications.
        requiredScopes:
        - connectors:read
        retrySemantics: safe
        title: List PostgreSQL publications for an unsaved connector
        triggerDescription: Use when you need to list PostgreSQL publications for an unsaved connector.
  /connectors/schemas:
    post:
      description: Lists available schemas in a specific database using an unsaved connector configuration. Useful during connector setup to discover existing schemas.
      operationId: unsaved_connector_fetch_schemas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorFetchSchemasRequest'
        required: true
      responses:
