openapi: 3.2.0
info:
  description: External API endpoints for Artie
  title: Artie Data Catalog API
  version: v1.0.139
servers:
- url: https://api.artie.com
security:
- ApiKey: []
tags:
- name: Data Catalog
paths:
  /data-catalog/search:
    post:
      description: Searches across the company's data catalog using full-text search.
      operationId: data_catalog_search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsDataCatalogSearchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyDataCatalogMatch'
          description: OK
        '500':
          description: Internal Server Error
      summary: Search the data catalog
      tags:
      - Data Catalog
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: data_catalog_search
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - data_catalog:read
        retrySemantics: safe
        title: Search the data catalog
        triggerDescription: Searches ingested catalog metadata. For live source tables, use connector_fetch_tables.
components:
  schemas:
    PayloadsDataCatalogDatabase:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    PayloadsDataCatalogSearchRequest:
      properties:
        query:
          type: string
      type: object
    PayloadsDataCatalogMatchedObject:
      properties:
        database:
          $ref: '#/components/schemas/PayloadsDataCatalogDatabase'
        schema:
          $ref: '#/components/schemas/PayloadsDataCatalogSchema'
        table:
          $ref: '#/components/schemas/PayloadsDataCatalogTable'
      type: object
    PayloadsDataCatalogMatch:
      properties:
        connectorUUID:
          format: uuid
          type: string
        object:
          $ref: '#/components/schemas/PayloadsDataCatalogMatchedObject'
        score:
          format: double
          type: number
      required:
      - score
      - connectorUUID
      - object
      type: object
    PayloadsDataCatalogTable:
      properties:
        databaseName:
          type: string
        name:
          type: string
        schemaName:
          type: string
      required:
      - name
      - schemaName
      - databaseName
      type: object
    PayloadsDataCatalogSchema:
      properties:
        databaseName:
          type: string
        name:
          type: string
      required:
      - name
      - databaseName
      type: object
    ListResponseBodyDataCatalogMatch:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PayloadsDataCatalogMatch'
          type: array
      required:
      - items
      type: object
  securitySchemes:
    ApiKey:
      description: API key passed as a Bearer token in the Authorization header.
      scheme: bearer
      type: http
