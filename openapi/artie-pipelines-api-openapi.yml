openapi: 3.2.0
info:
  description: External API endpoints for Artie
  title: Artie Pipelines API
  version: v1.0.139
servers:
- url: https://api.artie.com
security:
- ApiKey: []
tags:
- name: Pipelines
paths:
  /pipelines:
    get:
      description: Returns pipelines for the authenticated company, optionally filtered by environment.
      operationId: pipeline_list
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyLightPipeline'
          description: OK
        '500':
          description: Internal Server Error
      summary: List pipelines
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: pipeline_list
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - pipelines:read
        retrySemantics: safe
        title: List pipelines
        triggerDescription: Lists pipelines with uuid, name, and status. This is not a full configuration — do not send it to pipeline_update. Full config, per-table status, and table UUIDs are pipeline_detail. Failure messages are pipeline_error_logs, not status. sourceReaderUUID is not a connector id; call connector_list before connector_fetch_table_detail or other connector_fetch_* tools.
    post:
      description: Creates a pipeline attached to an existing source reader (pipeline.sourceReaderUUID). The reader must have no pipeline yet, or be shared. To start a new capture from a source connector, use POST /pipelines/create-from-source.
      operationId: pipeline_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullPipeline'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Create a pipeline on an existing source reader
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: pipeline_create
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: unsafe
        title: Create a pipeline on an existing source reader
        triggerDescription: 'Attaches a new pipeline to an existing sourceReaderUUID. The reader must be unused or already shared (fan-out: one CDC capture, many destinations). To start a new capture from a source connector, use pipeline_create_from_source.'
  /pipelines/{uuid}:
    delete:
      description: Deletes a pipeline by UUID.
      operationId: pipeline_delete
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '500':
          description: Internal Server Error
      summary: Delete pipeline
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_delete
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:delete
        retrySemantics: safe-after-state-check
        title: Delete pipeline
        triggerDescription: Permanently deletes a pipeline by UUID. Does not delete connectors.
    get:
      description: Returns FullPipeline for the pipeline uuid (tables with uuid/status, destinationUUID, specificDestCfg, sourceReaderUUID). MCP clients must omit includeRelatedObjects. The Dashboard UI may pass includeRelatedObjects=true to wrap sourceReader and connectors; that body is not the documented 200 schema.
      operationId: pipeline_detail
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: includeRelatedObjects
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullPipeline'
          description: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Get pipeline configuration
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: pipeline_detail
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - pipelines:read
        retrySemantics: safe
        title: Get pipeline configuration
        triggerDescription: 'Returns FullPipeline for a uuid from pipeline_list: tables (uuid, name, schema, status), destinationUUID, specificDestCfg, and sourceReaderUUID. Echo this into pipeline_update; do not send pipeline_list. Use for per-table status and backfill table UUIDs. sourceReaderUUID is the uuid for source_reader_detail and source_reader_update, not a connector uuid. This is not lag (pipeline_usage) or error logs (pipeline_error_logs). Omit includeRelatedObjects — that Dashboard flag wraps connectors and is not this tool''s success shape.'
    post:
      description: 'Full replace of an existing pipeline by UUID. Omitted fields are written as zero values: missing dataPlaneName 400s, missing tables deletes every table. Clients must echo the last FullPipeline and change only the intended fields.'
      operationId: pipeline_update
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullPipeline'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Update pipeline
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: pipeline_update
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: unsafe
        title: Update pipeline
        triggerDescription: Replaces the full pipeline configuration (not a PATCH). Echo the last FullPipeline from pipeline_create_from_source, pipeline_update, or pipeline_detail — not pipeline_list — and send destinationUUID and tables together; a destination-only body is rejected and omitting tables deletes all tables.
  /pipelines/{uuid}/automatic-schema-changes:
    post:
      description: Enqueues automatic schema changes for one eligible pipeline. Set forceRefresh to bypass the two-hour cooldown for this execution. The request is accepted before reconciliation completes.
      operationId: pipeline_trigger_automatic_schema_changes
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: forceRefresh
        schema:
          type: boolean
      responses:
        '202':
          description: Accepted
        '404':
          description: Not Found
        '409':
          description: Conflict
        '500':
          description: Internal Server Error
      summary: Trigger automatic schema changes
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_trigger_automatic_schema_changes
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: safe-after-state-check
        title: Trigger automatic schema changes for a pipeline
        triggerDescription: Applies detected source DDL on one pipeline. For every eligible pipeline, use company_trigger_automatic_schema_changes.
  /pipelines/{uuid}/backfill:
    post:
      description: Triggers a backfill for specified tables in the pipeline. Supports options for pre-backfill behavior (drop, truncate, or do nothing) and schema/database filtering.
      operationId: pipeline_backfill_tables
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineBackfillRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      summary: Backfill pipeline tables
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_backfill_tables
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: unsafe
        title: Backfill pipeline tables
        triggerDescription: Backfills tables already on a running pipeline by table UUID from pipeline_detail (not connector_fetch_tables). To attach tables, use pipeline_update.
  /pipelines/{uuid}/backfill/cancel:
    post:
      description: Cancels backfilling for the given table UUIDs and/or history table UUIDs.
      operationId: pipeline_cancel_backfill_tables
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineCancelBackfillRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Cancel backfill
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: true
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_cancel_backfill_tables
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: safe-after-state-check
        title: Cancel backfill
        triggerDescription: Cancels an in-progress backfill for the given table UUIDs.
  /pipelines/{uuid}/detect-schema-changes:
    post:
      description: Enqueues a background job that checks the pipeline's source database for new, removed, or altered tables. If the pipeline has auto-replicate or auto-history mode enabled, any newly discovered tables will be added to the pipeline automatically. An email summary is sent if changes are detected.
      operationId: pipeline_detect_schema_changes
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: Detect schema changes
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_detect_schema_changes
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: unsafe
        title: Detect schema changes
        triggerDescription: Checks the source for table or schema drift. To apply destination DDL, use pipeline_trigger_automatic_schema_changes.
  /pipelines/{uuid}/error-logs:
    get:
      description: Returns recent error logs for the specified pipeline (message, errorDetail, table/schema, timestamps). MCP clients pass the pipeline uuid only.
      operationId: pipeline_error_logs
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyPipelineErrorLog'
          description: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: List pipeline error logs
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: false
        operationId: pipeline_error_logs
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - pipelines:read
        retrySemantics: safe
        title: List pipeline error logs
        triggerDescription: Returns recent error logs for a saved pipeline (message, errorDetail, table/schema, timestamps). Pass the pipeline uuid from pipeline_list. Use when the user asks why a pipeline failed or is unhealthy. This is not lag (pipeline_usage), per-table status (pipeline_detail), or replication slot size.
  /pipelines/{uuid}/start:
    post:
      description: 'Starts or resumes a pipeline. Fails if the pipeline has no destination, no tables, or (Postgres/Cockroach/Oracle) a source reader with an empty database. Optional body: keepPaused, disableBackFill.'
      operationId: pipeline_start
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineStartRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      summary: Start pipeline
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_start
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: unsafe
        title: Start pipeline
        triggerDescription: Deploys a draft or resumes a paused pipeline once destination, tables, and (Postgres/Cockroach/Oracle) reader database are set. Do not call immediately after create-from-source. If start 400s that two source readers share replication slot artie, GET source_reader_detail for sourceReaderUUID from pipeline_detail, set settings.replicationSlotOverride to a unique name, POST source_reader_update with the echoed reader, then retry start.
  /pipelines/{uuid}/status:
    post:
      description: Changes the status of a pipeline (e.g. running, paused). Validates the pipeline before resuming and deploys the configuration change.
      operationId: pipeline_update_status
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineUpdateStatusRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPipelineUpdateStatusResponse'
          description: OK
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '500':
          description: Internal Server Error
      summary: Update pipeline status
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_update_status
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: safe-after-state-check
        title: Update pipeline status
        triggerDescription: Pauses or resumes an already-configured pipeline. For first deploy, use pipeline_start.
  /pipelines/{uuid}/update-with-source-reader:
    post:
      description: Updates pipeline and optionally its source reader in one request. Accepts gzip-encoded body.
      operationId: pipeline_update_with_source_reader
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineUpdateWithSourceReaderRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPipelineUpdateWithSourceReaderResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Update pipeline with source reader
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exclusionReason: Accepts and returns source-reader configuration that can contain credentials.
        exposure: excluded
        idempotentHint: false
        inputSensitivity: restricted-credentials
        openWorldHint: false
        operationId: pipeline_update_with_source_reader
        outputSensitivity: restricted-credentials
        readOnlyHint: false
        remediation: Update the pipeline separately and manage source-reader credentials outside MCP.
        requiredScopes:
        - pipelines:write
        retrySemantics: unsafe
        title: Update pipeline with source reader
        triggerDescription: Use when you need to update pipeline with source reader.
  /pipelines/{uuid}/usage:
    get:
      description: Returns table-level usage statistics for the specified pipeline within a given time range. Requires 'from' and 'to' query parameters in RFC3339 format. Pass 'excludeBackfills=true' to exclude backfill rows from row counts.
      operationId: pipeline_usage
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: from
        required: true
        schema:
          format: date-time
          type: string
      - in: query
        name: to
        required: true
        schema:
          format: date-time
          type: string
      - description: When true, rows processed by backfills are excluded from row counts so only CDC rows are counted. Latency is not affected. Defaults to false.
        in: query
        name: excludeBackfills
        schema:
          description: When true, rows processed by backfills are excluded from row counts so only CDC rows are counted. Latency is not affected. Defaults to false.
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPipelineUsageResponse'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Get pipeline usage
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: true
        inputSensitivity: none
        openWorldHint: true
        operationId: pipeline_usage
        outputSensitivity: none
        readOnlyHint: true
        requiredScopes:
        - pipelines:read
        retrySemantics: safe
        title: Get pipeline usage
        triggerDescription: Returns per-table ingestion lag and row counts for a saved pipeline over a time range. Pass the pipeline uuid plus from and to as RFC3339 timestamps; set excludeBackfills=true to leave backfill rows out of row counts. Use when the user asks about lag, throughput, or rows processed. This is not slot health, warehouse correctness, pipeline_list status, pipeline_detail table status, or error logs (pipeline_error_logs).
  /pipelines/create-from-source:
    post:
      description: Creates a draft pipeline and a dedicated source reader. Provide sourceConnectorUUID to use an existing source, or sourceType to create a stub source connector. Optional destinationType creates a stub destination. To attach another pipeline to the same reader, use POST /pipelines with a shared sourceReaderUUID.
      operationId: pipeline_create_from_source
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineCreateFromSourceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullPipeline'
          description: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Create a new pipeline from a source
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        exposure: exposed
        idempotentHint: false
        inputSensitivity: none
        openWorldHint: false
        operationId: pipeline_create_from_source
        outputSensitivity: none
        readOnlyHint: false
        requiredScopes:
        - pipelines:write
        retrySemantics: unsafe
        title: Create a new pipeline from a source
        triggerDescription: Creates a draft pipeline plus a new dedicated (non-shared) source reader. Pass sourceConnectorUUID to reuse a saved source; sourceType alone inserts an empty connector. For Postgres, Cockroach, and Oracle, pass database (from connector_fetch_databases) so the new reader can start. For a second destination on the same capture, use pipeline_create on a shared reader.
  /pipelines/validate-unsaved-destination:
    post:
      description: Validates destination configuration without persisting. Returns 204 on success or 200 with error message on validation failure.
      operationId: pipeline_validate_unsaved_destination
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineValidateUnsavedDestinationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterValidateErrorResponse'
          description: OK
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Validate unsaved destination
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exclusionReason: Accepts an unsaved destination connector configuration that can contain credentials.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: pipeline_validate_unsaved_destination
        outputSensitivity: none
        readOnlyHint: true
        remediation: Save the destination connector first, then use a safe pipeline tool.
        requiredScopes:
        - pipelines:read
        retrySemantics: safe
        title: Validate unsaved destination
        triggerDescription: Use when you need to validate unsaved destination.
  /pipelines/validate-unsaved-source:
    post:
      description: Validates source reader and connector configuration without persisting. Returns 204 on success or 200 with error message on validation failure.
      operationId: pipeline_validate_unsaved_source
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineValidateUnsavedSourceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterValidateErrorResponse'
          description: OK
        '204':
          description: No Content
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      summary: Validate unsaved source
      tags:
      - Pipelines
      x-artie-mcp:
        bodilessSuccess: true
        destructiveHint: false
        exclusionReason: Accepts an unsaved source connector and source-reader configuration that can contain credentials.
        exposure: excluded
        idempotentHint: true
        inputSensitivity: restricted-credentials
        openWorldHint: true
        operationId: pipeline_validate_unsaved_source
        outputSensitivity: none
        readOnlyHint: true
        remediation: Save the source configuration first, then use the safe pipeline tools.
        requiredScopes:
        - pipelines:read
        retrySemantics: safe
        title: Validate unsaved source
        triggerDescription: Use when you need to validate unsaved source.
components:
  schemas:
    RouterPipelineUpdateStatusResponse:
      properties:
        pipeline:
          $ref: '#/components/schemas/PayloadsFullPipeline'
      required:
      - pipeline
      type: object
    PayloadsFullPipeline:
      properties:
        advancedSettings:
          $ref: '#/components/schemas/PayloadsPipelineAdvancedSettings'
        backfillStages:
          items:
            $ref: '#/components/schemas/PayloadsBackfillStageEvent'
          type: array
        columnHashingSaltUUID:
          format: uuid
          type:
          - 'null'
          - string
        companyUUID:
          format: uuid
          type: string
        createdAt:
          format: date-time
          type: string
        dataPlaneName:
          type: string
        destinationUUID:
          format: uuid
          type:
          - 'null'
          - string
        encryptionKeyUUID:
          format: uuid
          type:
          - 'null'
          - string
        environmentUUID:
          format: uuid
          type: string
        hasBackfillingTables:
          type: boolean
        hasUndeployedChanges:
          type: boolean
        historyBackfillStages:
          items:
            $ref: '#/components/schemas/PayloadsBackfillStageEvent'
          type: array
        isDeploying:
          type: boolean
        lastDeployError:
          type: string
        lastDeployFailedAt:
          format: date-time
          type:
          - 'null'
          - string
        lastDeployedAt:
          format: date-time
          type:
          - 'null'
          - string
        lastUpdatedAt:
          format: date-time
          type: string
        name:
          type: string
        snowflakeEcoScheduleUUID:
          format: uuid
          type:
          - 'null'
          - string
        sourceReaderUUID:
          format: uuid
          type: string
        sourceType:
          $ref: '#/components/schemas/EnumsConnectorSlug'
        specificDestCfg:
          $ref: '#/components/schemas/PayloadsSpecificConfig'
        status:
          $ref: '#/components/schemas/EnumsPipelineStatus'
        tables:
          items:
            $ref: '#/components/schemas/PayloadsTable'
          type: array
        uuid:
          format: uuid
          type: string
      required:
      - uuid
      - companyUUID
      - dataPlaneName
      - environmentUUID
      - name
      - createdAt
      - lastUpdatedAt
      - isDeploying
      - sourceType
      - hasUndeployedChanges
      - tables
      - specificDestCfg
      - advancedSettings
      type: object
    PayloadsSpecificConfig:
      properties:
        bucketName:
          type: string
        checkpointInterval:
          type: integer
        compaction:
          $ref: '#/components/schemas/PayloadsCompactionConfig'
        containerName:
          type: string
        database:
          type: string
        dynamicallyCreateNamespaces:
          type: boolean
        externalStageName:
          type: string
        externalStageS3Bucket:
          type: string
        externalStageS3Prefix:
          type: string
        folderName:
          type: string
        schema:
          type: string
        schemaNamePrefix:
          type: string
        tableNameSeparator:
          type: string
        useSameSchemaAsSource:
          type: boolean
      type: object
    PayloadsAdvancedPipelineSettingsPayload:
      properties:
        appendOnly:
          type:
          - 'null'
          - boolean
        autoEnableHistoryForNewTables:
          type:
          - 'null'
          - boolean
        autoEnableHistoryIgnoreRegex:
          type:
          - 'null'
          - string
        autoEnableHistoryIncludeRegex:
          type:
          - 'null'
          - string
        autoReplicateIgnoreRegex:
          type:
          - 'null'
          - string
        autoReplicateIncludeRegex:
          type:
          - 'null'
          - string
        autoReplicateNewTables:
          type:
