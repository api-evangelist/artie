aid: artie
name: Artie
description: >-
  Artie is a real-time data replication platform that streams database changes
  to cloud data warehouses and lakehouses with sub-minute latency and
  exactly-once delivery. It captures change data (CDC) from sources such as
  PostgreSQL, MySQL, MongoDB, Oracle, and DynamoDB and continuously merges them
  into destinations including Snowflake, BigQuery, Databricks, Redshift, and
  Apache Iceberg, eliminating the need to build and operate Kafka or Debezium
  infrastructure. Artie handles advanced backfills, schema evolution,
  column-level encryption and hashing, data catalog search, PrivateLink/SSH
  connectivity, and observability, and exposes a REST API plus a webhook event
  stream so teams can programmatically manage pipelines, connectors, and source
  readers. Artie is venture-backed by Canaan Partners and General Catalyst.
